name: baicaoyuan

services:
  app:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TIP_DATABASE_PATH: /data/db.sqlite3
      TIP_MEDIA_ROOT: /media
      DJANGO_STATIC_ROOT: /static
      TIP_ALLOW_REGISTRATION: ${TIP_ALLOW_REGISTRATION:-false}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.filebased.EmailBackend}
      EMAIL_FILE_PATH: /data/mail
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD_FILE: /run/secrets/smtp_password
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-baicaoyuan@localhost}
    secrets:
      - django_secret_key
      - smtp_password
    volumes:
      - database:/data
      - media:/media
      - static:/static
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      UPSTREAM_SCHEME: ${UPSTREAM_SCHEME:-http}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - static:/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

secrets:
  django_secret_key:
    file: ./.secrets/django_secret_key
  smtp_password:
    file: ./.secrets/smtp_password

volumes:
  database:
  media:
  static:
  caddy_data:
  caddy_config:
