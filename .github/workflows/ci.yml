name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend_django
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django migrations
        run: |
          cd backend_django
          python manage.py migrate

      - name: Backend unit tests
        run: |
          cd backend_django
          python manage.py test

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend_vue
          npm ci

      - name: Build frontend
        run: |
          cd frontend_vue
          npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Initialize isolated Compose configuration
        run: sh scripts/init-compose.sh
      - name: Build and start demonstration stack
        run: docker compose --env-file .env.compose up -d --build --wait --wait-timeout 120
      - name: Check same-origin routes and application health
        run: python3 scripts/check-compose.py
      - name: Collect container logs
        if: failure()
        run: docker compose --env-file .env.compose logs --tail 100
      - name: Stop CI stack
        if: always()
        run: docker compose --env-file .env.compose down
